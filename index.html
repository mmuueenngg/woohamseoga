
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우함서가</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171a19;
      color: #e5e9df;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      text-align: center;
    }

    .eyebrow {
      color: #8d9c8b;
      font-size: 10px;
      letter-spacing: 0.28em;
      margin-bottom: 42px;
    }

    h1 {
      font-size: 42px;
      font-weight: 400;
      letter-spacing: 0.18em;
      margin: 0 0 16px;
    }

    .subtitle {
      color: #aab5a5;
      font-size: 13px;
      letter-spacing: 0.2em;
      margin-bottom: 58px;
    }

    .morse-area {
      margin: 0 auto 52px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .morse-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }

    .syllable {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 48px;
    }

    .syllable-name {
      color: #aab5a5;
      font-size: 14px;
      letter-spacing: 0.12em;
    }

    .signals {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      min-height: 12px;
    }

    .signal {
      display: inline-block;
      height: 4px;
      width: 4px;
      border-radius: 50%;
      background: #465347;
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }

    .signal.dash {
      width: 16px;
      border-radius: 3px;
    }

    .signal.active {
      background: #c4e2a5;
      box-shadow: 0 0 10px rgba(196, 226, 165, 0.55);
    }

    .player {
      margin: 0 auto;
      width: 100%;
      max-width: 360px;
    }

    audio {
      width: 100%;
      height: 42px;
      margin-bottom: 18px;
    }

    .download {
      display: inline-block;
      color: #aab5a5;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-decoration: none;
      border-bottom: 1px solid #536052;
      padding-bottom: 5px;
    }

    .download:hover {
      color: #d5e8c2;
      border-color: #d5e8c2;
    }

    footer {
      margin-top: 76px;
      color: #596458;
      font-size: 10px;
      letter-spacing: 0.35em;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 34px;
      }

      .morse-line {
        gap: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="eyebrow">AN EXPERIMENTAL MUSIC PIECE</div>

    <h1>우함서가</h1>
    <div class="subtitle">우리 · 함께 · 서로 · 같이</div>

    <section class="morse-area" aria-label="우함서가 모스 부호">
      <div class="morse-line" id="morse-line"></div>
    </section>

    <section class="player">
      <audio id="audio" controls preload="metadata">
        <source src="./woohamseoga.mp3" type="audio/mpeg">
        브라우저가 오디오 재생을 지원하지 않습니다.
      </audio>

      <a class="download"
         href="./woohamseoga.mp3"
         download="woohamseoga.mp3">
        DOWNLOAD AUDIO
      </a>
    </section>

    <footer>W O O H A M S E O G A</footer>
  </main>

  <script>
    const morse = [
      { name: "우", code: "-.- ...." },
      { name: "함", code: ".--- . --" },
      { name: "서", code: "--. -" },
      { name: "가", code: ".-.. ." }
    ];

    const line = document.getElementById("morse-line");
    const audio = document.getElementById("audio");

    const syllables = [];

    morse.forEach((item) => {
      const syllable = document.createElement("div");
      syllable.className = "syllable";

      const name = document.createElement("div");
      name.className = "syllable-name";
      name.textContent = item.name;

      const signals = document.createElement("div");
      signals.className = "signals";

      const signalElements = [];

      item.code.replace(/\s/g, "").split("").forEach((symbol) => {
        const signal = document.createElement("span");
        signal.className = symbol === "-" ? "signal dash" : "signal";
        signals.appendChild(signal);
        signalElements.push(signal);
      });

      syllable.appendChild(name);
      syllable.appendChild(signals);
      line.appendChild(syllable);

      syllables.push(signalElements);
    });

    const patterns = morse.map(item =>
      item.code.replace(/\s/g, "").split("")
    );

    const signalDuration = 0.42;
    const gapDuration = 0.10;

    const timeline = [];

    patterns.forEach((pattern, syllableIndex) => {
      pattern.forEach((symbol, signalIndex) => {
        timeline.push({
          syllableIndex,
          signalIndex,
          start: timeline.length * (signalDuration + gapDuration),
          end: timeline.length * (signalDuration + gapDuration) + signalDuration
        });
      });
    });

    function updateAnimation() {
      const currentTime = audio.currentTime;

      syllables.forEach((signals) => {
        signals.forEach(signal => signal.classList.remove("active"));
      });

      timeline.forEach(segment => {
        if (
          currentTime >= segment.start &&
          currentTime < segment.end
        ) {
          const signal =
            syllables[segment.syllableIndex][segment.signalIndex];

          if (signal) {
            signal.classList.add("active");
          }
        }
      });
    }

    audio.addEventListener("timeupdate", updateAnimation);
    audio.addEventListener("seeked", updateAnimation);

    audio.addEventListener("ended", () => {
      syllables.forEach(signals => {
        signals.forEach(signal => signal.classList.remove("active"));
      });
    });
  </script>
</body>
</html>
